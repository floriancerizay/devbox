services:

  geoserver:
    container_name: geoserver
    image: ${DOCKERHUB_PROXY:-}kartoza/geoserver:2.28.5
    environment:
      - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
      - INITIAL_MEMORY=512M
      - MAXIMUM_MEMORY=1G
      - SAMPLE_DATA=false
      # Reverse proxy (traefik)
      - GEOSERVER_CSRF_WHITELIST=geoserver.${DEVBOX_HOSTNAME}
      - HTTP_PROXY_NAME=geoserver.${DEVBOX_HOSTNAME}
      - HTTP_SCHEME=https
      - HTTP_PROXY_PORT=${TRAEFIK_HTTPS_PORT:-443}
    volumes:
      - geoserver-data:/opt/geoserver/data_dir
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.geoserver.rule=Host(`geoserver.${DEVBOX_HOSTNAME}`)"
      - "traefik.http.services.geoserver.loadbalancer.server.port=8080"
    restart: unless-stopped

volumes:
  geoserver-data:
    name: geoserver-data

networks:
  default:
    name: devbox
    external: true
