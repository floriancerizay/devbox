# Keycloak utilise la base "keycloak" du conteneur postgis (voir postgis/create-databases.sh)
services:

  keycloak:
    container_name: keycloak
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.4.7}
    # https://www.keycloak.org/server/reverseproxy
    command: start-dev --proxy-headers xforwarded --http-enabled=true
    environment:
      - KC_HOSTNAME=https://keycloak.${DEVBOX_HOSTNAME}:${TRAEFIK_HTTPS_PORT:-443}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgis:5432/${KEYCLOAK_DB}
      - KC_DB_USERNAME=${POSTGRES_USER}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.${DEVBOX_HOSTNAME}`)"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    restart: unless-stopped

networks:
  default:
    name: devbox
    external: true
