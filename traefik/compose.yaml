services:

  traefik:
    container_name: traefik
    image: ${DOCKERHUB_PROXY:-}${TRAEFIK_IMAGE:-traefik:v3.6.25}
    ports:
      - "${DEVBOX_PORT_PREFIX:-}${TRAEFIK_HTTP_PORT:-80}:80"
      - "${DEVBOX_PORT_PREFIX:-}${TRAEFIK_HTTPS_PORT:-443}:443"
    environment:
      - DEVBOX_HOSTNAME=${DEVBOX_HOSTNAME}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DEVBOX_HOSTNAME}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
    volumes:
      - traefik-certs:/certs:rw
      - ./config:/etc/traefik:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # le userns-remap (installation docker IGN) empêche de lire le socket docker
    userns_mode: 'host'
    restart: unless-stopped

volumes:
  traefik-certs:
    name: traefik-certs

networks:
  default:
    name: devbox
    external: true
