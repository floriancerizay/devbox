services:

  postgis:
    container_name: postgis
    image: ${DOCKERHUB_PROXY:-}${POSTGIS_IMAGE}
    ports:
      - "${DEVBOX_PORT_PREFIX}${POSTGIS_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgis-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgis-data:
    name: postgis-data-15

networks:
  default:
    name: devbox
    external: true
